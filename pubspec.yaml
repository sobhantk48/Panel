name: panel
description: "Nahan Gateway Management Panel"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # Networking
  dio: ^5.4.3+1

  # Local Storage (ذخیره امن کلید و آدرس سرور)
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3

  # UI/UX
  cupertino_icons: ^1.0.6
  google_fonts: ^6.2.1
  fl_chart: ^0.68.0          # برای نمودار stats
  flutter_svg: ^2.0.10+1
  qr_flutter: 4.1.0

  # Utils
  intl: ^0.20.2
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  build_runner: ^2.4.11
  freezed: ^2.5.7
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
  generate: true   # فعال‌سازی l10n

  assets:
    - assets/images/
