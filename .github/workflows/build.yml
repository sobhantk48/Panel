name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          channel: stable

      # اسکلت اندروید هر بار از نو ساخته می‌شود
      - name: Regenerate platform scaffolding
        run: flutter create --platforms=android .

      # Impeller را بعد از ساخت اسکلت غیرفعال می‌کنیم (باگ رندر روی GPU مالی)
      - name: Disable Impeller in AndroidManifest
        run: |
          sed -i 's|</application>|    <meta-data android:name="io.flutter.embedding.android.EnableImpeller" android:value="false" />\n    </application>|' android/app/src/main/AndroidManifest.xml

      # تأیید اینکه تزریق واقعاً انجام شده
      - name: Verify manifest
        run: cat android/app/src/main/AndroidManifest.xml

      - run: flutter pub get
      - run: flutter build apk --release --no-tree-shake-icons

      - uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
