name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          channel: stable

      # پروژه فقط شامل کد Dart است؛ این خط اسکلت android را می‌سازد
      - name: Regenerate platform scaffolding
        run: flutter create --platforms=android .

      # غیرفعال‌کردن Impeller با تزریق meta-data قبل از بسته‌شدن تگ application
      - name: Disable Impeller
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's#</application>#    <meta-data android:name="io.flutter.embedding.android.EnableImpeller" android:value="false" />\n    </application>#' "$MANIFEST"

      # نمایش مانیفست در لاگ برای اطمینان از تزریق
      - name: Verify manifest
        run: cat android/app/src/main/AndroidManifest.xml

      - run: flutter pub get
      - run: flutter build apk --release --no-tree-shake-icons

      - uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
